apiVersion: v1
kind: ConfigMap
metadata:
  name: convertflow-config
data:
  APP_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convertflow
  labels:
    app: convertflow
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: convertflow
  template:
    metadata:
      labels:
        app: convertflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: convertflow
          image: convertflow:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: convertflow-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: convertflow
spec:
  type: NodePort
  selector:
    app: convertflow
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
